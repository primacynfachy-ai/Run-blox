<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLOX RUN</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #141c2b;
            --surface-light: #1b2538;
            --accent: #ff3b3b;
            --accent2: #ffe140;
            --text: #f0f0f8;
            --text-dim: #8899b4;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
            --radius: 22px;
            --radius-sm: 13px;
            --cell: 50px;
            --grid-px: 500px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 22% 12%, rgba(255, 59, 59, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 88%, rgba(59, 123, 255, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 55%, rgba(192, 68, 255, 0.04) 0%, transparent 60%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        body.dragging {
            touch-action: none;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 560px;
            padding: 10px;
        }
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeSlide 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }
        .page.active {
            display: flex;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(11,15,26,0.92); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center;
            z-index: 300; flex-direction: column; gap: 16px;
        }
        .loading-overlay.active { display: flex; }
        .loading-blocks { display: flex; gap: 10px; }
        .loading-block { width: 28px; height: 28px; border-radius: 7px; animation: loadBounce 0.7s infinite; }
        .loading-block:nth-child(1){background:#FF3B3B;animation-delay:0s}
        .loading-block:nth-child(2){background:#3B8BFF;animation-delay:0.1s}
        .loading-block:nth-child(3){background:#00E64D;animation-delay:0.2s}
        .loading-block:nth-child(4){background:#FF8C00;animation-delay:0.3s}
        .loading-block:nth-child(5){background:#B844FF;animation-delay:0.4s}
        @keyframes loadBounce { 0%,100%{transform:translateY(0)scale(1)} 40%{transform:translateY(-22px)scale(1.15)} 60%{transform:translateY(-6px)scale(0.95)} }
        .loading-text { color:#fff; font-weight:700; letter-spacing:3px; font-size:0.9rem; animation:pulseText 1.3s infinite; }
        @keyframes pulseText { 0%,100%{opacity:0.5} 50%{opacity:1} }
        .start-card { background:var(--surface); border-radius:var(--radius); padding:42px 26px 34px; box-shadow:var(--shadow);
            width:100%; text-align:center; border:1px solid rgba(255,255,255,0.06); position:relative; overflow:hidden; isolation:isolate; }
        .deco-blocks { position:absolute; inset:0; pointer-events:none; z-index:0; }
        .deco-block { position:absolute; border-radius:10px; opacity:0.14; animation:floatDeco 6s infinite; filter:blur(0.5px); }
        .deco-block:nth-child(1){width:44px;height:44px;background:#FF3B3B;top:18%;left:8%;animation-delay:0s;animation-duration:5.2s}
        .deco-block:nth-child(2){width:36px;height:36px;background:#3B8BFF;top:12%;right:12%;animation-delay:1.1s;animation-duration:6.4s;border-radius:8px}
        .deco-block:nth-child(3){width:50px;height:28px;background:#00E676;bottom:22%;left:14%;animation-delay:2.3s;animation-duration:5.8s;border-radius:7px}
        .deco-block:nth-child(4){width:32px;height:32px;background:#FF9500;bottom:16%;right:16%;animation-delay:3.5s;animation-duration:7s;border-radius:50%}
        .deco-block:nth-child(5){width:40px;height:40px;background:#C044FF;top:40%;left:50%;animation-delay:4.2s;animation-duration:5.5s;border-radius:12px}
        .deco-block:nth-child(6){width:24px;height:38px;background:#FF2D8B;top:55%;right:8%;animation-delay:1.8s;animation-duration:6.8s;border-radius:6px}
        .deco-block:nth-child(7){width:34px;height:34px;background:#00D4C8;top:28%;left:25%;animation-delay:5.1s;animation-duration:5s;border-radius:9px}
        .deco-block:nth-child(8){width:42px;height:22px;background:#FFD60A;bottom:32%;left:40%;animation-delay:0.7s;animation-duration:6.2s;border-radius:5px}
        @keyframes floatDeco { 0%,100%{transform:translateY(0)rotate(0deg)scale(1)} 25%{transform:translateY(-22px)rotate(5deg)scale(1.08)} 50%{transform:translateY(-8px)rotate(-3deg)scale(0.94)} 75%{transform:translateY(-26px)rotate(2deg)scale(1.04)} }
        .sparkle { position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; pointer-events:none; z-index:0; animation:sparkleFloat 3.5s infinite; }
        .sparkle:nth-child(9){top:22%;left:30%;animation-delay:0s}
        .sparkle:nth-child(10){top:35%;right:28%;animation-delay:1.2s}
        .sparkle:nth-child(11){bottom:28%;left:20%;animation-delay:2.5s}
        .sparkle:nth-child(12){bottom:20%;right:22%;animation-delay:0.6s}
        @keyframes sparkleFloat { 0%,100%{opacity:0.25;transform:translateY(0)scale(1)} 50%{opacity:0.8;transform:translateY(-18px)scale(2.2)} }
        .title-main { font-family:'Bebas Neue',sans-serif; font-size:clamp(50px,12vw,78px); letter-spacing:5px; color:#fff; line-height:1; position:relative; z-index:1; }
        .title-main .u-special { font-family:'Caveat',cursive; font-size:1.4em; color:var(--accent2); display:inline-block; animation:bounceU 2.3s infinite;
            text-shadow:0 0 34px rgba(255,225,64,0.7),0 6px 16px rgba(255,180,30,0.35); margin:0 -3px; position:relative; top:0.05em; }
        @keyframes bounceU { 0%,100%{transform:translateY(0)} 28%{transform:translateY(-17px)} 48%{transform:translateY(0)} 68%{transform:translateY(-8px)} 84%{transform:translateY(0)} }
        .subtitle { font-family:'Bebas Neue',sans-serif; letter-spacing:6px; color:var(--text-dim); font-size:1rem; margin:6px 0 26px; position:relative; z-index:1; }
        .btn { font-weight:700; font-size:1.05rem; letter-spacing:1.5px; border-radius:50px; border:none; cursor:pointer;
            transition:all 0.22s cubic-bezier(0.4,0,0.2,1); text-transform:uppercase; outline:none; -webkit-tap-highlight-color:transparent;
            position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center; }
        .btn:active { transform:scale(0.93); }
        .btn-start { background:var(--accent); color:#fff; font-size:1.3rem; padding:18px 54px; letter-spacing:2px;
            box-shadow:0 10px 34px rgba(255,59,59,0.45); animation:pulseGlow 2.8s infinite; }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 8px 28px rgba(255,59,59,0.38)} 50%{box-shadow:0 15px 48px rgba(255,59,59,0.65),0 0 65px rgba(255,59,59,0.22)} }
        .btn-start:hover { background:#ff5858; transform:translateY(-3px); }
        .developer-text { font-size:0.82rem; color:var(--text-dim); margin-top:20px; letter-spacing:1.2px; position:relative; z-index:1; }
        .game-card { background:var(--surface); border-radius:var(--radius); padding:12px 8px 16px; box-shadow:var(--shadow);
            width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid rgba(255,255,255,0.05); }
        .game-header { display:flex; justify-content:space-between; align-items:center; width:100%; padding:0 4px; flex-wrap:wrap; gap:6px; }
        .btn-pause { width:36px; height:36px; border-radius:50%; background:var(--surface-light); border:2px solid rgba(255,255,255,0.2);
            cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; z-index:10; flex-shrink:0; }
        .btn-pause:hover { border-color:rgba(255,255,255,0.5); background:#243045; }
        .pause-bars { display:flex; gap:4px; }
        .pause-bar { width:4px; height:15px; background:#fff; border-radius:2px; }
        .stat { background:var(--surface-light); padding:9px 15px; border-radius:40px; font-weight:700; color:#fff; display:flex; align-items:center; gap:7px; font-size:0.85rem; }
        .canvas-wrapper { border-radius:16px; overflow:hidden; box-shadow:inset 0 0 35px rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.07);
            background:#080c14; width:100%; max-width:var(--grid-px); aspect-ratio:1; cursor:crosshair; }
        .canvas-wrapper.drag-hover { box-shadow:inset 0 0 45px rgba(255,225,64,0.12),0 0 30px rgba(255,225,64,0.15); border-color:rgba(255,225,64,0.35); }
        #boardCanvas { display:block; width:100%; height:100%; touch-action:none; }
        .piece-tray { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:2px 0; }
        .piece-card { background:var(--surface-light); border-radius:var(--radius-sm); padding:6px; border:2px solid rgba(255,255,255,0.1);
            cursor:grab; transition:all 0.2s; touch-action:none; }
        .piece-card:active { cursor:grabbing; transform:scale(0.95); }
        .piece-card.selected { border-color:var(--accent2); box-shadow:0 0 22px rgba(255,225,64,0.4); transform:translateY(-3px); }
        .drag-ghost { position:fixed; pointer-events:none; z-index:999; opacity:0; transition:opacity 0.08s;
            filter:drop-shadow(0 8px 20px rgba(0,0,0,0.6)); will-change:left,top,opacity; }
        .drag-ghost.active { opacity:0.94; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:200; }
        .overlay.active { display:flex; }
        .overlay-card { background:var(--surface); border-radius:24px; padding:30px 26px 24px; text-align:center;
            box-shadow:0 24px 55px rgba(0,0,0,0.7); max-width:360px; width:90%; animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
            display:flex; flex-direction:column; align-items:center; gap:8px; }
        @keyframes popIn { 0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1} }
        .overlay-emoji { font-size:3.8rem; margin-bottom:6px; }
        .overlay-title { font-family:'Bebas Neue',sans-serif; font-size:2.3rem; letter-spacing:3px; color:#fff; }
        .overlay-score { font-weight:700; color:var(--accent2); margin:2px 0 10px; font-size:1.1rem; }
        .btn-retry,.btn-continue,.btn-home,.btn-volume { padding:14px 38px; width:100%; max-width:250px; border-radius:50px;
            font-weight:700; font-size:0.95rem; letter-spacing:1px; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
        .btn-retry { background:var(--accent); color:#fff; box-shadow:0 8px 26px rgba(255,59,59,0.4); }
        .btn-continue { background:#2ed573; color:#000; box-shadow:0 8px 26px rgba(46,213,115,0.35); }
        .btn-home { background:transparent; border:2px solid rgba(255,255,255,0.2); color:#d0d0e0; }
        .btn-volume { background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.18); color:#e0e0e0; }
        .btn-volume:hover { border-color:rgba(255,255,255,0.45); color:#fff; background:rgba(255,255,255,0.13); }
        /* WHITE HINT TEXT */
        .hint-row {
            color: #ffffff !important;
        }
        .hint-dot {
            background: var(--accent2);
        }
        @media (max-width:520px){ :root{--cell:42px;--grid-px:420px} .app-container{padding:6px} .btn-start{font-size:1.1rem;padding:14px 38px} }
        @media (max-width:440px){ :root{--cell:36px;--grid-px:360px} }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-blocks"><div class="loading-block"></div><div class="loading-block"></div><div class="loading-block"></div><div class="loading-block"></div><div class="loading-block"></div></div><span class="loading-text">MEMUAT...</span></div>
    <div class="app-container">
        <div class="page active" id="startPage"><div class="start-card"><div class="deco-blocks"><div class="deco-block"></div><div class="deco-block"></div><div class="deco-block"></div><div class="deco-block"></div><div class="deco-block"></div><div class="deco-block"></div><div class="deco-block"></div><div class="deco-block"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div></div><div class="title-main">BL<span class="u-special">U</span>X RUN</div><p class="subtitle">Puzzle Blok • Seret & Letakkan</p><button class="btn btn-start" id="btnStart">▶ &nbsp;MULAI</button><p class="developer-text">Developer: <strong>Nnfachy</strong></p></div></div>
        <div class="page" id="gamePage"><div class="game-card"><div class="game-header"><button class="btn-pause" id="btnPause"><span class="pause-bars"><span class="pause-bar"></span><span class="pause-bar"></span></span></button><div class="stat"><span class="icon">⭐</span> Skor: <span id="scoreDisplay">0</span></div><div class="stat"><span class="icon">⏱️</span> <span id="timeDisplay">0:00</span></div></div><div class="canvas-wrapper" id="canvasWrapper"><canvas id="boardCanvas" width="500" height="500"></canvas></div><div class="piece-tray" id="pieceTray"></div><div class="hint-row"><span class="hint-dot"></span> Seret blok ke grid &nbsp;|&nbsp; 🖱️ Klik pilih lalu klik grid</div></div></div>
    </div>
    <div class="drag-ghost" id="dragGhost"><canvas id="ghostCanvas"></canvas></div>
    <div class="overlay" id="gameOverOverlay"><div class="overlay-card"><div class="overlay-emoji" id="overlayEmoji">😵</div><h2 class="overlay-title">GAME OVER</h2><p class="overlay-score">Skor Akhir: <strong id="finalScore">0</strong></p><button class="btn btn-retry" id="btnRetry">🔄 &nbsp;Coba Lagi</button><button class="btn btn-home" id="btnHome">🏠 &nbsp;Halaman Utama</button></div></div>
    <div class="overlay" id="pauseOverlay"><div class="overlay-card"><div class="pause-icon-big">⏸️</div><h2 class="overlay-title">JEDA</h2><p class="overlay-score">Permainan dijeda</p><button class="btn btn-continue" id="btnContinue">▶ &nbsp;Lanjut</button><button class="btn btn-home" id="btnPauseHome">🏠 &nbsp;Halaman Utama</button><button class="btn btn-volume" id="btnVolumeToggle"><span class="volume-icon">🎵</span> Musik: <span id="volumeLabel">ON</span></button></div></div>
    <script>
        (function() {
            const $ = id => document.getElementById(id);
            const loadingOverlay = $('loadingOverlay');
            const startPage = $('startPage');
            const gamePage = $('gamePage');
            const gameOverOverlay = $('gameOverOverlay');
            const pauseOverlay = $('pauseOverlay');
            const boardCanvas = $('boardCanvas');
            const ctx = boardCanvas.getContext('2d');
            const canvasWrapper = $('canvasWrapper');
            const scoreDisplay = $('scoreDisplay');
            const timeDisplay = $('timeDisplay');
            const finalScoreEl = $('finalScore');
            const overlayEmoji = $('overlayEmoji');
            const pieceTray = $('pieceTray');
            const dragGhost = $('dragGhost');
            const ghostCanvas = $('ghostCanvas');
            const ghostCtx = ghostCanvas.getContext('2d');
            const volumeLabel = $('volumeLabel');
            const volumeIcon = $('btnVolumeToggle').querySelector('.volume-icon');

            let audioCtx = null, musicGainNode = null, sfxGainNode = null;
            let startMusicInterval = null, gameMusicInterval = null;
            let audioInitialized = false, musicMuted = false; // renamed: hanya untuk musik

            function initAudio() {
                if (audioInitialized && audioCtx) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                    musicGainNode = audioCtx.createGain();
                    musicGainNode.gain.setValueAtTime(musicMuted ? 0 : 0.18, audioCtx.currentTime); // diperkecil
                    musicGainNode.connect(audioCtx.destination);
                    sfxGainNode = audioCtx.createGain();
                    sfxGainNode.gain.setValueAtTime(0.85, audioCtx.currentTime); // SFX tetap keras
                    sfxGainNode.connect(audioCtx.destination);
                    audioInitialized = true;
                } catch (e) { console.warn('Web Audio API tidak tersedia'); }
            }

            function toggleMusicMute() {
                musicMuted = !musicMuted;
                const mVol = musicMuted ? 0 : 0.18;
                if (musicGainNode) musicGainNode.gain.setValueAtTime(mVol, audioCtx.currentTime);
                // SFX tidak terpengaruh
                volumeLabel.textContent = musicMuted ? 'OFF' : 'ON';
                volumeIcon.textContent = musicMuted ? '🔇' : '🎵';
            }

            function ensureAudioRunning() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }

            function playTone(f, t, d, v, dl = 0) {
                if (!audioCtx || !sfxGainNode) return;
                ensureAudioRunning();
                const tm = audioCtx.currentTime + dl;
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, tm);
                g.gain.setValueAtTime(Math.min(v, 0.35), tm);
                g.gain.exponentialRampToValueAtTime(0.001, tm + d);
                o.connect(g); g.connect(sfxGainNode); o.start(tm); o.stop(tm + d);
            }

            function playMusicNote(f, t, d, v, dl = 0) {
                if (!audioCtx || !musicGainNode) return;
                ensureAudioRunning();
                const tm = audioCtx.currentTime + dl;
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, tm);
                g.gain.setValueAtTime(Math.min(v, 0.15), tm); // batasi volume not musik
                g.gain.exponentialRampToValueAtTime(0.001, tm + d);
                o.connect(g); g.connect(musicGainNode); o.start(tm); o.stop(tm + d);
            }

            function sfxSelect() { playTone(500,'sine',0.06,0.06); }
            function sfxPlace() { playTone(580,'square',0.09,0.08); }
            function sfxClear() { playTone(70,'sawtooth',0.22,0.4,0); playTone(110,'triangle',0.26,0.35,0.03); playTone(750,'square',0.1,0.25,0.05); playTone(1000,'square',0.1,0.22,0.08); playTone(1400,'square',0.12,0.2,0.11); playTone(1800,'sine',0.15,0.18,0.15); }
            function sfxGameOver() { playTone(280,'triangle',0.25,0.15,0); playTone(180,'triangle',0.3,0.15,0.22); }
            function sfxInvalid() { playTone(150,'sawtooth',0.12,0.05); }
            function sfxStartButton() { playTone(440,'square',0.1,0.08,0); playTone(554,'square',0.1,0.08,0.08); playTone(659,'square',0.1,0.08,0.16); playTone(880,'square',0.15,0.1,0.24); }
            function sfxLoading() { playTone(300,'sawtooth',0.35,0.07,0); playTone(500,'sawtooth',0.25,0.06,0.15); playTone(700,'sine',0.2,0.05,0.28); }
            function sfxPause() { playTone(400,'sine',0.08,0.06,0); playTone(300,'sine',0.1,0.05,0.06); }
            function sfxResume() { playTone(500,'sine',0.08,0.06,0); playTone(650,'sine',0.1,0.05,0.06); }

            function startStartPageMusic() {
                if (startMusicInterval || !audioInitialized) return;
                ensureAudioRunning();
                const mel = [{f:262,d:0.5},{f:330,d:0.5},{f:392,d:0.6},{f:330,d:0.4},{f:294,d:0.5},{f:349,d:0.5},{f:440,d:0.7},{f:349,d:0.5},{f:330,d:0.45},{f:294,d:0.45},{f:262,d:0.8},{f:220,d:0.5}];
                let i = 0;
                function play() { if(!startMusicInterval)return; const n=mel[i%mel.length]; playMusicNote(n.f,'sine',n.d*0.75,0.12,0); playMusicNote(n.f*1.5,'sine',n.d*0.4,0.05,n.d*0.08); if(i%4===0)playMusicNote(n.f/2,'triangle',n.d*1.1,0.08,0); i++; }
                play(); startMusicInterval = setInterval(play,1950);
            }
            function stopStartPageMusic() { if(startMusicInterval){clearInterval(startMusicInterval);startMusicInterval=null;} }

            function startGameplayMusic() {
                if (gameMusicInterval || !audioInitialized) return;
                ensureAudioRunning();
                const bass=[110,110,130,130,146,146,130,110,98,110,130,146];
                const chords=[[330,392,440],[330,392,440],[349,440,523],[349,440,523],[392,466,587],[392,466,587],[349,440,523],[330,392,440],[294,349,440],[330,392,440],[349,440,523],[392,466,587]];
                let i=0;
                function play() { if(!gameMusicInterval)return; const b=bass[i%12],ch=chords[i%12]; playMusicNote(b,'triangle',0.3,0.14,0); playMusicNote(b*2,'sine',0.15,0.06,0.04); ch.forEach((f,j)=>playMusicNote(f,'square',0.16,0.04,0.06+j*0.04)); if(i%4===0)playMusicNote(b/2,'sine',0.5,0.06,0); i++; }
                play(); gameMusicInterval = setInterval(play,850);
            }
            function stopGameplayMusic() { if(gameMusicInterval){clearInterval(gameMusicInterval);gameMusicInterval=null;} }
            function pauseAllMusic() { stopStartPageMusic(); stopGameplayMusic(); }

            const GRID_SIZE=10;
            function getCellSize(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell').trim())||50; }
            function getGridPx(){ return getCellSize()*GRID_SIZE; }
            function updateCanvasSize(){ const gp=getGridPx(); boardCanvas.width=gp; boardCanvas.height=gp; drawBoard(); }
            const COLORS=['#FF2B2B','#3B7BFF','#00E64D','#FF8C00','#B844FF','#FF1D8B','#00D9CC','#FFD600'];
            const PIECE_SHAPES={dot:[[0,0]],dominoH:[[0,0],[0,1]],dominoV:[[0,0],[1,0]],square2:[[0,0],[0,1],[1,0],[1,1]],line3H:[[0,0],[0,1],[0,2]],line3V:[[0,0],[1,0],[2,0]],lSmall1:[[0,0],[0,1],[1,0]],lSmall2:[[0,0],[0,1],[1,1]],lSmall3:[[0,0],[1,0],[1,1]],lSmall4:[[0,1],[1,0],[1,1]],tShape1:[[0,0],[0,1],[0,2],[1,1]],tShape2:[[0,1],[1,0],[1,1],[1,2]],tShape3:[[0,1],[1,0],[1,1],[2,1]],tShape4:[[0,0],[1,0],[1,1],[2,0]],sShape1:[[0,1],[0,2],[1,0],[1,1]],sShape2:[[0,0],[1,0],[1,1],[2,1]],zShape1:[[0,0],[0,1],[1,1],[1,2]],zShape2:[[0,1],[1,0],[1,1],[2,0]],lBig1:[[0,0],[0,1],[0,2],[1,0]],lBig2:[[0,0],[0,1],[0,2],[1,2]],lBig3:[[0,0],[1,0],[2,0],[2,1]],lBig4:[[0,1],[1,1],[2,0],[2,1]],cross:[[0,1],[1,0],[1,1],[1,2],[2,1]],uShape:[[0,0],[0,2],[1,0],[1,1],[1,2]],line4H:[[0,0],[0,1],[0,2],[0,3]],line4V:[[0,0],[1,0],[2,0],[3,0]],bigSquare:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]};

            let grid=[], pieces=[], selectedPieceIndex=-1, score=0, gameActive=false, gamePaused=false;
            let startTime=0, timerInterval=null, pauseStartTime=0, totalPausedMs=0;

            function resetGrid(){ grid=Array(GRID_SIZE).fill().map(()=>Array(GRID_SIZE).fill(null)); }
            function canPlace(shape,sr,sc){ for(const [r,c] of shape){ const nr=sr+r,nc=sc+c; if(nr<0||nr>=GRID_SIZE||nc<0||nc>=GRID_SIZE)return false; if(grid[nr][nc]!==null)return false; } return true; }

            function placePiece(idx,sr,sc){

            function checkGameOver(){ if(!gameActive||gamePaused)return; if(pieces.length===0)genPieces(3); if(!anyPlaceable())endGame(); }

            function drawBoard(){

            function findClosestShapeCell(shape,cx,cy,sr,sc){ const CS=getCellSize(); let bestDist=Infinity,bestR=0,bestC=0; for(const [r,c] of shape){ const cellCx=(sc+c)*CS+CS/2,cellCy=(sr+r)*CS+CS/2,dist=Math.hypot(cellCx-cx,cellCy-cy); if(dist<bestDist){bestDist=dist;bestR=r;bestC=c;} } return{r:bestR,c:bestC}; }
            function startDrag(e,idx){

            function showStart(){ gameActive=false; gamePaused=false; pauseOverlay.classList.remove('active'); stopGameplayMusic(); if(timerInterval)clearInterval(timerInterval); gameOverOverlay.classList.remove('active'); startPage.classList.add('active'); gamePage.classList.remove('active'); dragState=null; dragGhost.classList.remove('active'); document.body.classList.remove('dragging'); clearingCells=[]; particles=[]; popAnims=[]; scorePopups=[]; shockwaves=[]; shakeAmount=0; shakeDuration=0; resetGrid(); pieces=[]; selectedPieceIndex=-1; pieceTray.innerHTML=''; updateCanvasSize(); drawBoard(); if(audioInitialized && !musicMuted) startStartPageMusic(); }
            function startGame(){ initAudio(); ensureAudioRunning(); sfxStartButton(); stopStartPageMusic(); loadingOverlay.classList.add('active'); sfxLoading(); setTimeout(()=>{ loadingOverlay.classList.remove('active'); resetGrid(); score=0; totalPausedMs=0; pauseStartTime=0; clearingCells=[]; clearAnimTimer=0; particles=[]; popAnims=[]; scorePopups=[]; shockwaves=[]; shakeAmount=0; shakeDuration=0; dragState=null; gamePaused=false; pauseOverlay.classList.remove('active'); dragGhost.classList.remove('active'); document.body.classList.remove('dragging'); updateScore(); updateTimeDisplay(); gameActive=true; selectedPieceIndex=-1; pieces=[]; updateCanvasSize(); genPieces(3); drawBoard(); renderTray(); startPage.classList.remove('active'); gamePage.classList.add('active'); gameOverOverlay.classList.remove('active'); startTimer(); if(!musicMuted) startGameplayMusic(); },600); }
            function retryGame(){ initAudio(); ensureAudioRunning(); sfxStartButton(); stopGameplayMusic(); gamePaused=false; pauseOverlay.classList.remove('active'); loadingOverlay.classList.add('active'); sfxLoading(); setTimeout(()=>{ loadingOverlay.classList.remove('active'); resetGrid(); score=0; totalPausedMs=0; pauseStartTime=0; clearingCells=[]; clearAnimTimer=0; particles=[]; popAnims=[]; scorePopups=[]; shockwaves=[]; shakeAmount=0; shakeDuration=0; dragState=null; dragGhost.classList.remove('active'); document.body.classList.remove('dragging'); updateScore(); updateTimeDisplay(); gameActive=true; selectedPieceIndex=-1; pieces=[]; updateCanvasSize(); genPieces(3); drawBoard(); renderTray(); gameOverOverlay.classList.remove('active'); startTimer(); if(!musicMuted) startGameplayMusic(); },500); }
            function goHome(){ gameActive=false; gamePaused=false; pauseOverlay.classList.remove('active'); stopGameplayMusic(); if(timerInterval)clearInterval(timerInterval); gameOverOverlay.classList.remove('active'); startPage.classList.add('active'); gamePage.classList.remove('active'); dragState=null; dragGhost.classList.remove('active'); document.body.classList.remove('dragging'); clearingCells=[]; particles=[]; popAnims=[]; scorePopups=[]; shockwaves=[]; shakeAmount=0; shakeDuration=0; resetGrid(); pieces=[]; selectedPieceIndex=-1; pieceTray.innerHTML=''; updateCanvasSize(); drawBoard(); if(audioInitialized && !musicMuted) startStartPageMusic(); }

            $('btnStart').addEventListener('click',e=>{e.preventDefault();startGame();});
            $('btnRetry').addEventListener('click',e=>{e.preventDefault();retryGame();});
            $('btnHome').addEventListener('click',e=>{e.preventDefault();goHome();});
            $('btnPause').addEventListener('click',e=>{e.preventDefault();if(!gameActive)return;initAudio();ensureAudioRunning();gamePaused?resumeGame():pauseGame();});
            $('btnContinue').addEventListener('click',e=>{e.preventDefault();resumeGame();});
            $('btnPauseHome').addEventListener('click',e=>{e.preventDefault();goHomeFromPause();});
            $('btnVolumeToggle').addEventListener('click',e=>{e.preventDefault();initAudio();ensureAudioRunning();toggleMusicMute();});

            let lastT=performance.now();
            function loop(ts){ const dt=Math.min((ts-lastT)/16.67,3); lastT=ts; if(gameActive&&!gamePaused){ if(clearAnimTimer>0){clearAnimTimer-=16.67;if(clearAnimTimer<0)clearAnimTimer=0;} if(shakeDuration>0){shakeDuration-=16.67;if(shakeDuration<=0){shakeAmount=0;shakeDuration=0;}} for(let i=popAnims.length-1;i>=0;i--){popAnims[i].life-=0.04*dt;if(popAnims[i].life<=0)popAnims.splice(i,1);} updateParticles(dt); drawBoard(); } if(gameActive&&gamePaused)drawBoard(); requestAnimationFrame(loop); }

            resetGrid(); updateCanvasSize(); drawBoard(); requestAnimationFrame(loop);
            document.addEventListener('click',function firstInteraction(){initAudio();ensureAudioRunning();if(!musicMuted)startStartPageMusic();document.removeEventListener('click',firstInteraction);},{once:true});
            document.addEventListener('touchstart',function firstTouch(){initAudio();ensureAudioRunning();if(!musicMuted)startStartPageMusic();document.removeEventListener('touchstart',firstTouch);},{once:true});
            window.addEventListener('resize',()=>{updateCanvasSize();renderTray();if(dragState){dragGhost.classList.remove('active');dragState=null;document.body.classList.remove('dragging');}});
            window.addEventListener('blur',()=>{if(dragState){dragState=null;dragGhost.classList.remove('active');document.body.classList.remove('dragging');} pauseAllMusic();});
            window.addEventListener('focus',()=>{if(gameActive&&!gamePaused&&audioInitialized&&!musicMuted)startGameplayMusic();else if(!gameActive&&audioInitialized&&startPage.classList.contains('active')&&!musicMuted)startStartPageMusic();});
            document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseAllMusic();}else{if(gameActive&&!gamePaused&&audioInitialized&&!musicMuted)startGameplayMusic();else if(!gameActive&&audioInitialized&&startPage.classList.contains('active')&&!musicMuted)startStartPageMusic();}});
        })();
    </script>
</body>
</html>
