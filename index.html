<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLOX RUN</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #141c2b;
            --surface-light: #1b2538;
            --accent: #ff3b3b;
            --accent2: #ffe140;
            --text: #f0f0f8;
            --text-dim: #8899b4;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
            --radius: 22px;
            --radius-sm: 13px;
            --cell: 55px;
            --grid-px: 440px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 22% 12%, rgba(255, 59, 59, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 88%, rgba(59, 123, 255, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 55%, rgba(192, 68, 255, 0.04) 0%, transparent 60%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        body.dragging {
            touch-action: none;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            transition: padding 0.3s;
        }
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeSlide 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }
        .page.active {
            display: flex;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 26, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            flex-direction: column;
            gap: 16px;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-blocks {
            display: flex;
            gap: 10px;
        }
        .loading-block {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            animation: loadBounce 0.7s ease-in-out infinite;
        }
        .loading-block:nth-child(1) {
            background: #FF3B3B;
            animation-delay: 0s;
        }
        .loading-block:nth-child(2) {
            background: #3B8BFF;
            animation-delay: 0.1s;
        }
        .loading-block:nth-child(3) {
            background: #00E64D;
            animation-delay: 0.2s;
        }
        .loading-block:nth-child(4) {
            background: #FF8C00;
            animation-delay: 0.3s;
        }
        .loading-block:nth-child(5) {
            background: #B844FF;
            animation-delay: 0.4s;
        }
        @keyframes loadBounce {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            40% {
                transform: translateY(-22px) scale(1.15);
            }
            60% {
                transform: translateY(-6px) scale(0.95);
            }
        }
        .loading-text {
            color: #fff;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: 0.9rem;
            animation: pulseText 1.3s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }
        .start-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 42px 26px 34px;
            box-shadow: var(--shadow);
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .deco-blocks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .deco-block {
            position: absolute;
            border-radius: 10px;
            opacity: 0.14;
            animation: floatDeco 6s ease-in-out infinite;
            filter: blur(0.5px);
        }
        .deco-block:nth-child(1) {
            width: 44px;
            height: 44px;
            background: #FF3B3B;
            top: 18%;
            left: 8%;
            animation-delay: 0s;
            animation-duration: 5.2s;
        }
        .deco-block:nth-child(2) {
            width: 36px;
            height: 36px;
            background: #3B8BFF;
            top: 12%;
            right: 12%;
            animation-delay: 1.1s;
            animation-duration: 6.4s;
            border-radius: 8px;
        }
        .deco-block:nth-child(3) {
            width: 50px;
            height: 28px;
            background: #00E676;
            bottom: 22%;
            left: 14%;
            animation-delay: 2.3s;
            animation-duration: 5.8s;
            border-radius: 7px;
        }
        .deco-block:nth-child(4) {
            width: 32px;
            height: 32px;
            background: #FF9500;
            bottom: 16%;
            right: 16%;
            animation-delay: 3.5s;
            animation-duration: 7s;
            border-radius: 50%;
        }
        .deco-block:nth-child(5) {
            width: 40px;
            height: 40px;
            background: #C044FF;
            top: 40%;
            left: 50%;
            animation-delay: 4.2s;
            animation-duration: 5.5s;
            border-radius: 12px;
        }
        .deco-block:nth-child(6) {
            width: 24px;
            height: 38px;
            background: #FF2D8B;
            top: 55%;
            right: 8%;
            animation-delay: 1.8s;
            animation-duration: 6.8s;
            border-radius: 6px;
        }
        .deco-block:nth-child(7) {
            width: 34px;
            height: 34px;
            background: #00D4C8;
            top: 28%;
            left: 25%;
            animation-delay: 5.1s;
            animation-duration: 5s;
            border-radius: 9px;
        }
        .deco-block:nth-child(8) {
            width: 42px;
            height: 22px;
            background: #FFD60A;
            bottom: 32%;
            left: 40%;
            animation-delay: 0.7s;
            animation-duration: 6.2s;
            border-radius: 5px;
        }
        @keyframes floatDeco {
            0%,
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            25% {
                transform: translateY(-22px) rotate(5deg) scale(1.08);
            }
            50% {
                transform: translateY(-8px) rotate(-3deg) scale(0.94);
            }
            75% {
                transform: translateY(-26px) rotate(2deg) scale(1.04);
            }
        }
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            pointer-events: none;
            z-index: 0;
            animation: sparkleFloat 3.5s ease-in-out infinite;
        }
        .sparkle:nth-child(9) {
            top: 22%;
            left: 30%;
            animation-delay: 0s;
        }
        .sparkle:nth-child(10) {
            top: 35%;
            right: 28%;
            animation-delay: 1.2s;
        }
        .sparkle:nth-child(11) {
            bottom: 28%;
            left: 20%;
            animation-delay: 2.5s;
        }
        .sparkle:nth-child(12) {
            bottom: 20%;
            right: 22%;
            animation-delay: 0.6s;
        }
        @keyframes sparkleFloat {
            0%,
            100% {
                opacity: 0.25;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 0.8;
                transform: translateY(-18px) scale(2.2);
            }
        }
        .title-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(50px, 12vw, 78px);
            letter-spacing: 5px;
            color: #fff;
            line-height: 1;
            position: relative;
            z-index: 1;
        }
        .title-main .u-special {
            font-family: 'Caveat', cursive;
            font-size: 1.4em;
            color: var(--accent2);
            display: inline-block;
            animation: bounceU 2.3s ease-in-out infinite;
            text-shadow: 0 0 34px rgba(255, 225, 64, 0.7), 0 6px 16px rgba(255, 180, 30, 0.35);
            margin: 0 -3px;
            position: relative;
            top: 0.05em;
        }
        @keyframes bounceU {
            0%,
            100% {
                transform: translateY(0);
            }
            28% {
                transform: translateY(-17px);
            }
            48% {
                transform: translateY(0);
            }
            68% {
                transform: translateY(-8px);
            }
            84% {
                transform: translateY(0);
            }
        }
        .subtitle {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 6px;
            color: var(--text-dim);
            font-size: 1rem;
            margin: 6px 0 26px;
            position: relative;
            z-index: 1;
        }
        .btn {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 1.5px;
            padding: 15px 44px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 1;
        }
        .btn:active {
            transform: scale(0.93);
        }
        .btn-start {
            background: var(--accent);
            color: #fff;
            font-size: 1.3rem;
            padding: 18px 54px;
            letter-spacing: 2px;
            box-shadow: 0 10px 34px rgba(255, 59, 59, 0.45);
            animation: pulseGlow 2.8s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 8px 28px rgba(255, 59, 59, 0.38);
            }
            50% {
                box-shadow: 0 15px 48px rgba(255, 59, 59, 0.65), 0 0 65px rgba(255, 59, 59, 0.22);
            }
        }
        .btn-start:hover {
            background: #ff5858;
            transform: translateY(-3px);
        }
        .developer-text {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-top: 20px;
            letter-spacing: 1.2px;
            position: relative;
            z-index: 1;
        }
        .game-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 10px 18px;
            box-shadow: var(--shadow);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            transition: padding 0.3s;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .game-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-pause {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--surface-light);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-pause:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: #243045;
        }
        .btn-pause:active {
            transform: scale(0.9);
            border-color: var(--accent2);
        }
        .pause-bars {
            display: flex;
            gap: 4px;
        }
        .pause-bar {
            width: 4px;
            height: 16px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.2s;
        }
        .stat {
            background: var(--surface-light);
            padding: 10px 17px;
            border-radius: 40px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .stat .icon {
            font-size: 1.2rem;
        }
        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.07);
            background: #080c14;
            width: 100%;
            max-width: var(--grid-px);
            aspect-ratio: 1;
            cursor: crosshair;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .canvas-wrapper.drag-hover {
            box-shadow: inset 0 0 45px rgba(255, 225, 64, 0.12), 0 0 30px rgba(255, 225, 64, 0.15);
            border-color: rgba(255, 225, 64, 0.35);
        }
        #boardCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .piece-tray {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2px 0;
            transition: gap 0.3s;
        }
        .piece-card {
            background: var(--surface-light);
            border-radius: var(--radius-sm);
            padding: 7px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: grab;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            touch-action: none;
        }
        .piece-card:active {
            cursor: grabbing;
            transform: scale(0.95);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        }
        .piece-card.selected {
            border-color: var(--accent2);
            box-shadow: 0 0 22px rgba(255, 225, 64, 0.4);
            transform: translateY(-3px);
        }
        .piece-card.dragging-source {
            opacity: 0.3;
            transform: scale(0.88);
            border-style: dashed;
        }
        .piece-canvas {
            display: block;
            pointer-events: none;
        }
        .hint-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            font-size: 0.72rem;
            letter-spacing: 0.4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hint-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent2);
            animation: pulseDot 1.4s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.08s ease;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
            will-change: left, top, opacity;
        }
        .drag-ghost.active {
            opacity: 0.94;
        }
        .drag-ghost canvas {
            display: block;
            image-rendering: auto;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.3s ease;
        }
        .overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .overlay-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 34px 26px 28px;
            text-align: center;
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.7);
            max-width: 340px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .overlay-emoji {
            font-size: 3.8rem;
            margin-bottom: 6px;
            animation: bounceU 1.8s ease-in-out infinite;
        }
        .overlay-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.3rem;
            letter-spacing: 3px;
            color: #fff;
        }
        .overlay-score {
            font-weight: 700;
            color: var(--accent2);
            margin: 10px 0 22px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        .btn-retry {
            background: var(--accent);
            color: #fff;
            padding: 14px 38px;
            width: 100%;
            max-width: 250px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 26px rgba(255, 59, 59, 0.4);
        }
        .btn-retry:hover {
            background: #ff5858;
            box-shadow: 0 12px 34px rgba(255, 59, 59, 0.55);
        }
        .btn-home {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #d0d0e0;
            padding: 12px 34px;
            width: 100%;
            max-width: 250px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }
        .btn-home:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }
        .btn-continue {
            background: #2ed573;
            color: #000;
            padding: 14px 38px;
            width: 100%;
            max-width: 250px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 26px rgba(46, 213, 115, 0.35);
        }
        .btn-continue:hover {
            background: #3de07d;
            box-shadow: 0 12px 34px rgba(46, 213, 115, 0.5);
        }
        .pause-icon-big {
            font-size: 3rem;
            margin-bottom: 4px;
        }
        @media (max-width: 460px) {
            .app-container {
                padding: 6px;
            }
            .start-card {
                padding: 28px 12px 22px;
                border-radius: 18px;
            }
            .btn-start {
                font-size: 1.1rem;
                padding: 14px 38px;
            }
            .piece-card {
                padding: 5px;
                border-radius: 10px;
            }
            .game-card {
                padding: 10px 4px 14px;
                border-radius: 18px;
            }
            .stat {
                padding: 7px 10px;
                font-size: 0.76rem;
            }
            .canvas-wrapper {
                border-radius: 12px;
            }
            .btn-pause {
                width: 32px;
                height: 32px;
            }
            .pause-bar {
                width: 3px;
                height: 13px;
            }
            :root {
                --cell: 46px;
                --grid-px: 368px;
            }
        }
        @media (max-width: 380px) {
            :root {
                --cell: 40px;
                --grid-px: 320px;
            }
            .piece-tray {
                gap: 8px;
            }
            .piece-card {
                padding: 4px;
            }
            .game-card {
                padding: 8px 2px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-blocks">
            <div class="loading-block"></div><div class="loading-block"></div>
            <div class="loading-block"></div><div class="loading-block"></div><div class="loading-block"></div>
        </div>
        <span class="loading-text">MEMUAT...</span>
    </div>

    <div class="app-container">
        <div class="page active" id="startPage">
            <div class="start-card">
                <div class="deco-blocks">
                    <div class="deco-block"></div><div class="deco-block"></div>
                    <div class="deco-block"></div><div class="deco-block"></div>
                    <div class="deco-block"></div><div class="deco-block"></div>
                    <div class="deco-block"></div><div class="deco-block"></div>
                    <div class="sparkle"></div><div class="sparkle"></div>
                    <div class="sparkle"></div><div class="sparkle"></div>
                </div>
                <div class="title-main">BL<span class="u-special">U</span>X RUN</div>
                <p class="subtitle">Puzzle Blok • Seret & Letakkan</p>
                <button class="btn btn-start" id="btnStart">▶ &nbsp;MULAI</button>
                <p class="developer-text">Developer: <strong>Nnfachy</strong></p>
            </div>
        </div>
        <div class="page" id="gamePage">
            <div class="game-card" id="gameCardInner">
                <div class="game-header">
                    <div class="game-header-left">
                        <button class="btn-pause" id="btnPause" aria-label="Jeda permainan">
                            <span class="pause-bars">
                                <span class="pause-bar"></span>
                                <span class="pause-bar"></span>
                            </span>
                        </button>
                    </div>
                    <div class="stat"><span class="icon">⭐</span> Skor: <span id="scoreDisplay">0</span></div>
                    <div class="stat"><span class="icon">⏱️</span> <span id="timeDisplay">0:00</span></div>
                </div>
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="boardCanvas" width="440" height="440" aria-label="Grid 8x8"></canvas>
                </div>
                <div class="piece-tray" id="pieceTray"></div>
                <div class="hint-row">
                    <span class="hint-dot"></span> Seret blok ke grid &nbsp;|&nbsp; 🖱️ Klik pilih lalu klik grid
                </div>
            </div>
        </div>
    </div>

    <div class="drag-ghost" id="dragGhost"><canvas id="ghostCanvas"></canvas></div>
    <div class="overlay" id="gameOverOverlay">
        <div class="overlay-card">
            <div class="overlay-emoji" id="overlayEmoji">😵</div>
            <h2 class="overlay-title">GAME OVER</h2>
            <p class="overlay-score">Skor Akhir: <strong id="finalScore">0</strong></p>
            <button class="btn btn-retry" id="btnRetry">🔄 &nbsp;Coba Lagi</button>
            <button class="btn btn-home" id="btnHome">🏠 &nbsp;Halaman Utama</button>
        </div>
    </div>
    <div class="overlay" id="pauseOverlay">
        <div class="overlay-card">
            <div class="pause-icon-big">⏸️</div>
            <h2 class="overlay-title">JEDA</h2>
            <p class="overlay-score">Permainan dijeda</p>
            <button class="btn btn-continue" id="btnContinue">▶ &nbsp;Lanjut</button>
            <button class="btn btn-home" id="btnPauseHome">🏠 &nbsp;Halaman Utama</button>
        </div>
    </div>

    <script>
        (function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const startPage = document.getElementById('startPage');
            const gamePage = document.getElementById('gamePage');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const pauseOverlay = document.getElementById('pauseOverlay');
            const boardCanvas = document.getElementById('boardCanvas');
            const ctx = boardCanvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const finalScoreEl = document.getElementById('finalScore');
            const overlayEmoji = document.getElementById('overlayEmoji');
            const pieceTray = document.getElementById('pieceTray');
            const dragGhost = document.getElementById('dragGhost');
            const ghostCanvas = document.getElementById('ghostCanvas');
            const ghostCtx = ghostCanvas.getContext('2d');

            /* ═══════════════════════════════════════════════
               AUDIO ENGINE (100% synthesized – no copyright)
               ═══════════════════════════════════════════════ */
            let audioCtx = null;
            let musicGainNode = null;
            let startMusicInterval = null;
            let gameMusicInterval = null;
            let audioInitialized = false;

            function initAudio() {
                if (audioInitialized && audioCtx) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().then(() => {
                            console.log('🔊 AudioContext resumed');
                        }).catch(e => console.warn('Audio resume gagal:', e));
                    }
                    musicGainNode = audioCtx.createGain();
                    musicGainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    musicGainNode.connect(audioCtx.destination);
                    audioInitialized = true;
                    console.log('🎵 Audio siap – musik & SFX aktif');
                } catch (e) {
                    console.warn('Web Audio API tidak tersedia:', e);
                }
            }

            function ensureAudioRunning() {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().then(() => {
                        console.log('🔊 AudioContext resumed');
                    });
                }
            }

            function playTone(freq, type, duration, volume, delay = 0) {
                if (!audioCtx) return;
                ensureAudioRunning();
                const t = audioCtx.currentTime + delay;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(Math.min(volume, 0.12), t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + duration);
            }

            function playMusicNote(freq, type, duration, vol, delay = 0) {
                if (!audioCtx || !musicGainNode) return;
                ensureAudioRunning();
                const t = audioCtx.currentTime + delay;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(Math.min(vol, 0.1), t);
                g.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(g);
                g.connect(musicGainNode);
                osc.start(t);
                osc.stop(t + duration);
            }

            /* ── Sound Effects ── */
            function sfxSelect() { playTone(500, 'sine', 0.06, 0.05); }

            function sfxPlace() { playTone(580, 'square', 0.09, 0.07); }

            function sfxClear() {
                playTone(700, 'square', 0.09, 0.08, 0);
                playTone(950, 'square', 0.09, 0.08, 0.07);
                playTone(1200, 'square', 0.1, 0.08, 0.14);
            }

            function sfxGameOver() {
                playTone(280, 'triangle', 0.25, 0.1, 0);
                playTone(180, 'triangle', 0.3, 0.1, 0.22);
            }

            function sfxInvalid() { playTone(150, 'sawtooth', 0.12, 0.04); }

            function sfxStartButton() {
                playTone(440, 'square', 0.1, 0.07, 0);
                playTone(554, 'square', 0.1, 0.07, 0.08);
                playTone(659, 'square', 0.1, 0.07, 0.16);
                playTone(880, 'square', 0.15, 0.09, 0.24);
            }

            function sfxLoading() {
                playTone(300, 'sawtooth', 0.35, 0.06, 0);
                playTone(500, 'sawtooth', 0.25, 0.05, 0.15);
                playTone(700, 'sine', 0.2, 0.04, 0.28);
            }

            function sfxPause() {
                playTone(400, 'sine', 0.08, 0.05, 0);
                playTone(300, 'sine', 0.1, 0.04, 0.06);
            }

            function sfxResume() {
                playTone(500, 'sine', 0.08, 0.05, 0);
                playTone(650, 'sine', 0.1, 0.04, 0.06);
            }

            /* ── START PAGE MUSIC (calm, melodic loop) ── */
            function startStartPageMusic() {
                if (startMusicInterval) return;
                initAudio();
                ensureAudioRunning();
                console.log('🎵 Memulai musik halaman awal');
                const melody = [
                    { freq: 262, dur: 0.5 },
                    { freq: 330, dur: 0.5 },
                    { freq: 392, dur: 0.6 },
                    { freq: 330, dur: 0.4 },
                    { freq: 294, dur: 0.5 },
                    { freq: 349, dur: 0.5 },
                    { freq: 440, dur: 0.7 },
                    { freq: 349, dur: 0.5 },
                    { freq: 330, dur: 0.45 },
                    { freq: 294, dur: 0.45 },
                    { freq: 262, dur: 0.8 },
                    { freq: 220, dur: 0.5 },
                ];
                let idx = 0;

                function playPhrase() {
                    if (!startMusicInterval) return;
                    const n = melody[idx % melody.length];
                    playMusicNote(n.freq, 'sine', n.dur * 0.75, 0.04, 0);
                    playMusicNote(n.freq * 1.5, 'sine', n.dur * 0.4, 0.015, n.dur * 0.08);
                    if (idx % 4 === 0) playMusicNote(n.freq / 2, 'triangle', n.dur * 1.1, 0.03, 0);
                    idx++;
                }
                playPhrase();
                startMusicInterval = setInterval(playPhrase, 1950);
            }

            function stopStartPageMusic() {
                if (startMusicInterval) {
                    clearInterval(startMusicInterval);
                    startMusicInterval = null;
                    console.log('🎵 Musik halaman awal dihentikan');
                }
            }

            /* ── GAMEPLAY MUSIC (rhythmic, energetic loop) ── */
            function startGameplayMusic() {
                if (gameMusicInterval) return;
                initAudio();
                ensureAudioRunning();
                console.log('🎵 Memulai musik gameplay');
                const bass = [110, 110, 130, 130, 146, 146, 130, 110, 98, 110, 130, 146];
                const chords = [
                    [330, 392, 440],
                    [330, 392, 440],
                    [349, 440, 523],
                    [349, 440, 523],
                    [392, 466, 587],
                    [392, 466, 587],
                    [349, 440, 523],
                    [330, 392, 440],
                    [294, 349, 440],
                    [330, 392, 440],
                    [349, 440, 523],
                    [392, 466, 587]
                ];
                let idx = 0;

                function playBeat() {
                    if (!gameMusicInterval) return;
                    const b = bass[idx % bass.length];
                    const ch = chords[idx % chords.length];
                    playMusicNote(b, 'triangle', 0.3, 0.05, 0);
                    playMusicNote(b * 2, 'sine', 0.15, 0.02, 0.04);
                    ch.forEach((f, i) => {
                        playMusicNote(f, 'square', 0.16, 0.018, 0.06 + i * 0.04);
                    });
                    if (idx % 4 === 0) playMusicNote(b / 2, 'sine', 0.5, 0.025, 0);
                    idx++;
                }
                playBeat();
                gameMusicInterval = setInterval(playBeat, 850);
            }

            function stopGameplayMusic() {
                if (gameMusicInterval) {
                    clearInterval(gameMusicInterval);
                    gameMusicInterval = null;
                    console.log('🎵 Musik gameplay dihentikan');
                }
            }

            function pauseAllMusic() {
                stopStartPageMusic();
                stopGameplayMusic();
            }

            /* ═══════════════════════════════════════════════
               CONSTANTS
               ═══════════════════════════════════════════════ */
            const GRID_SIZE = 8;

            function getCellSize() {
                const style = getComputedStyle(document.documentElement);
                const cellPx = style.getPropertyValue('--cell').trim();
                return parseFloat(cellPx) || 55;
            }

            function getGridPx() { return getCellSize() * GRID_SIZE; }

            function updateCanvasSize() {
                const gp = getGridPx();
                boardCanvas.width = gp;
                boardCanvas.height = gp;
                drawBoard();
            }

            const COLORS = [
                '#FF2B2B', '#3B7BFF', '#00E64D', '#FF8C00',
                '#B844FF', '#FF1D8B', '#00D9CC', '#FFD600'
            ];

            const PIECE_SHAPES = {
                dot: [
                    [0, 0]
                ],
                dominoH: [
                    [0, 0],
                    [0, 1]
                ],
                dominoV: [
                    [0, 0],
                    [1, 0]
                ],
                square2: [
                    [0, 0],
                    [0, 1],
                    [1, 0],
                    [1, 1]
                ],
                line3H: [
                    [0, 0],
                    [0, 1],
                    [0, 2]
                ],
                line3V: [
                    [0, 0],
                    [1, 0],
                    [2, 0]
                ],
                lSmall1: [
                    [0, 0],
                    [0, 1],
                    [1, 0]
                ],
                lSmall2: [
                    [0, 0],
                    [0, 1],
                    [1, 1]
                ],
                lSmall3: [
                    [0, 0],
                    [1, 0],
                    [1, 1]
                ],
                lSmall4: [
                    [0, 1],
                    [1, 0],
                    [1, 1]
                ],
                tShape1: [
                    [0, 0],
                    [0, 1],
                    [0, 2],
                    [1, 1]
                ],
                tShape2: [
                    [0, 1],
                    [1, 0],
                    [1, 1],
                    [1, 2]
                ],
                tShape3: [
                    [0, 1],
                    [1, 0],
                    [1, 1],
                    [2, 1]
                ],
                tShape4: [
                    [0, 0],
                    [1, 0],
                    [1, 1],
                    [2, 0]
                ],
                sShape1: [
                    [0, 1],
                    [0, 2],
                    [1, 0],
                    [1, 1]
                ],
                sShape2: [
                    [0, 0],
                    [1, 0],
                    [1, 1],
                    [2, 1]
                ],
                zShape1: [
                    [0, 0],
                    [0, 1],
                    [1, 1],
                    [1, 2]
                ],
                zShape2: [
                    [0, 1],
                    [1, 0],
                    [1, 1],
                    [2, 0]
                ],
                lBig1: [
                    [0, 0],
                    [0, 1],
                    [0, 2],
                    [1, 0]
                ],
                lBig2: [
                    [0, 0],
                    [0, 1],
                    [0, 2],
                    [1, 2]
                ],
                lBig3: [
                    [0, 0],
                    [1, 0],
                    [2, 0],
                    [2, 1]
                ],
                lBig4: [
                    [0, 1],
                    [1, 1],
                    [2, 0],
                    [2, 1]
                ],
                cross: [
                    [0, 1],
                    [1, 0],
                    [1, 1],
                    [1, 2],
                    [2, 1]
                ],
                uShape: [
                    [0, 0],
                    [0, 2],
                    [1, 0],
                    [1, 1],
                    [1, 2]
                ],
            };

            const EASY = ['dot', 'dominoH', 'dominoV', 'square2'];
            const MEDIUM = ['line3H', 'line3V', 'lSmall1', 'lSmall2', 'lSmall3', 'lSmall4'];
            const HARD = ['tShape1', 'tShape2', 'tShape3', 'tShape4', 'sShape1', 'sShape2', 'zShape1', 'zShape2',
                'lBig1', 'lBig2', 'lBig3', 'lBig4', 'cross', 'uShape'
            ];

            function getShape(name) { return PIECE_SHAPES[name].map(([r, c]) => [r, c]); }

            function randomShapeName(diff) {
                let pool = [...EASY];
                if (diff >= 1) pool = pool.concat(MEDIUM);
                if (diff >= 2) pool = pool.concat(HARD);
                if (diff >= 3) pool = pool.concat(HARD, HARD);
                return pool[Math.floor(Math.random() * pool.length)];
            }

            function getBounds(shape) {
                const rs = shape.map(s => s[0]),
                    cs = shape.map(s => s[1]);
                return { minR: Math.min(...rs), maxR: Math.max(...rs), minC: Math.min(...cs), maxC: Math.max(...cs),
                    rows: Math.max(...rs) - Math.min(...rs) + 1, cols: Math.max(...cs) - Math.min(...cs) + 1 };
            }

            /* ═══════════════════════════════════════════════
               3D BLOCK RENDERER
               ═══════════════════════════════════════════════ */
            function draw3DBlock(c, x, y, size, color, alpha = 1) {
                c.save();
                c.globalAlpha = alpha;
                const s = size;
                c.fillStyle = 'rgba(0,0,0,0.35)';
                c.beginPath();
                c.roundRect(x + 3, y + 3, s - 3, s - 3, Math.round(s * 0.18));
                c.fill();
                c.fillStyle = color;
                c.beginPath();
                c.roundRect(x + 1, y + 1, s - 3, s - 3, Math.round(s * 0.18));
                c.fill();
                const hl = c.createLinearGradient(x, y, x, y + s * 0.5);
                hl.addColorStop(0, 'rgba(255,255,255,0.38)');
                hl.addColorStop(1, 'rgba(255,255,255,0)');
                c.fillStyle = hl;
                c.beginPath();
                c.roundRect(x + 3, y + 2, s - 7, s * 0.42, Math.round(s * 0.12));
                c.fill();
                const bs = c.createLinearGradient(x, y + s * 0.55, x, y + s);
                bs.addColorStop(0, 'rgba(0,0,0,0)');
                bs.addColorStop(1, 'rgba(0,0,0,0.28)');
                c.fillStyle = bs;
                c.beginPath();
                c.roundRect(x + 2, y + s * 0.5, s - 5, s * 0.48, Math.round(s * 0.13));
                c.fill();
                c.strokeStyle = 'rgba(255,255,255,0.18)';
                c.lineWidth = 1.2;
                c.beginPath();
                c.roundRect(x + 1, y + 1, s - 3, s - 3, Math.round(s * 0.18));
                c.stroke();
                c.restore();
            }

            function draw3DBlockSimple(c, x, y, size, color) {
                const s = size;
                c.fillStyle = color;
                c.beginPath();
                c.roundRect(x + 1, y + 1, s - 3, s - 3, Math.round(s * 0.18));
                c.fill();
                c.fillStyle = 'rgba(255,255,255,0.3)';
                c.beginPath();
                c.roundRect(x + 3, y + 2, s - 7, s * 0.38, Math.round(s * 0.1));
                c.fill();
                c.strokeStyle = 'rgba(255,255,255,0.2)';
                c.lineWidth = 1;
                c.beginPath();
                c.roundRect(x + 1, y + 1, s - 3, s - 3, Math.round(s * 0.18));
                c.stroke();
            }

            /* ═══════════════════════════════════════════════
               GAME STATE
               ═══════════════════════════════════════════════ */
            let grid = [];
            let pieces = [];
            let selectedPieceIndex = -1;
            let score = 0;
            let gameActive = false;
            let gamePaused = false;
            let startTime = 0;
            let timerInterval = null;
            let elapsedSeconds = 0;
            let pauseStartTime = 0;
            let totalPausedMs = 0;
            let difficultyLevel = 0;
            let clearingCells = [];
            let clearAnimTimer = 0;
            let particles = [];
            let popAnims = [];
            let dragState = null;

            function resetGrid() { grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null)); }

            function canPlace(shape, sr, sc) {
                for (const [r, c] of shape) {
                    const nr = sr + r,
                        nc = sc + c;
                    if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) return false;
                    if (grid[nr][nc] !== null) return false;
                }
                return true;
            }

            function anyPlaceable() {
                for (const p of pieces)
                    for (let r = 0; r < GRID_SIZE; r++)
                        for (let c = 0; c < GRID_SIZE; c++)
                            if (canPlace(p.shape, r, c)) return true;
                return false;
            }

            function genPieces(n = 3) {
                pieces = [];
                for (let i = 0; i < n; i++) {
                    const name = randomShapeName(difficultyLevel);
                    pieces.push({ shape: getShape(name), colorIdx: Math.floor(Math.random() * COLORS.length),
                    name });
                }
                selectedPieceIndex = -1;
                renderTray();
            }

            function spawnParticles(row, col, hex, n = 10) {
                const CS = getCellSize();
                const cx = col * CS + CS / 2;
                const cy = row * CS + CS / 2;
                for (let i = 0; i < n; i++) {
                    const a = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.5;
                    const s = 2.5 + Math.random() * 6;
                    particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, life: 1, decay: 0.018 + Math
                            .random() * 0.04, size: 3 + Math.random() * 5, color: hex });
                }
            }

            function updateParticles(dt) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 0.15 * dt;
                    p.life -= p.decay * dt;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function drawParticles(c) {
                for (const p of particles) {
                    c.save();
                    c.globalAlpha = Math.max(0, p.life);
                    c.fillStyle = p.color;
                    c.shadowColor = p.color;
                    c.shadowBlur = 6;
                    c.beginPath();
                    c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    c.fill();
                    c.shadowBlur = 0;
                    c.restore();
                }
            }

            /* ═══════════════════════════════════════════════
               PLACE & CLEAR
               ═══════════════════════════════════════════════ */
            function placePiece(idx, sr, sc) {
                if (!gameActive || gamePaused || idx < 0 || idx >= pieces.length) return false;
                const piece = pieces[idx];
                if (!canPlace(piece.shape, sr, sc)) return false;
                for (const [r, c] of piece.shape) {
                    grid[sr + r][sc + c] = piece.colorIdx;
                    popAnims.push({ row: sr + r, col: sc + c, life: 1 });
                }
                sfxPlace();
                pieces.splice(idx, 1);
                selectedPieceIndex = -1;
                const fullR = [],
                    fullC = [];
                for (let r = 0; r < GRID_SIZE; r++)
                    if (grid[r].every(cell => cell !== null)) fullR.push(r);
                for (let c = 0; c < GRID_SIZE; c++) {
                    let full = true;
                    for (let r = 0; r < GRID_SIZE; r++)
                        if (grid[r][c] === null) { full = false; break; }
                    if (full) fullC.push(c);
                }
                if (fullR.length || fullC.length) {
                    const set = new Set();
                    fullR.forEach(r => { for (let c = 0; c < GRID_SIZE; c++) set.add(`${r},${c}`); });
                    fullC.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) set.add(`${r},${c}`); });
                    const cells = Array.from(set).map(s => { const [r, c] = s.split(',').map(Number); return { row: r,
                            col: c }; });
                    cells.forEach(({ row, col }) => { if (grid[row][col] !== null) spawnParticles(row, col, COLORS[
                            grid[row][col]], 8); });
                    clearingCells = cells;
                    clearAnimTimer = 300;
                    sfxClear();
                    setTimeout(() => {
                        cells.forEach(({ row, col }) => { grid[row][col] = null; });
                        clearingCells = [];
                        score += cells.length * 10;
                        updateScore();
                        drawBoard();
                        checkGameOver();
                    }, 300);
                } else { checkGameOver(); }
                drawBoard();
                renderTray();
                if (pieces.length === 0 && gameActive && !gamePaused) {
                    setTimeout(() => { if (gameActive && !gamePaused && pieces.length === 0) { genPieces(3); if (!
                                anyPlaceable()) endGame();
                            drawBoard();
                            renderTray(); } }, 350);
                }
                return true;
            }

            function checkGameOver() {
                if (!gameActive || gamePaused) return;
                if (pieces.length === 0) genPieces(3);
                if (!anyPlaceable()) endGame();
            }

            function endGame() {
                gameActive = false;
                gamePaused = false;
                stopGameplayMusic();
                if (timerInterval) clearInterval(timerInterval);
                finalScoreEl.textContent = score;
                overlayEmoji.textContent = score >= 300 ? '🤯' : score >= 150 ? '😅' : score >= 60 ? '😵' : '💔';
                gameOverOverlay.classList.add('active');
                sfxGameOver();
                dragState = null;
                dragGhost.classList.remove('active');
                document.body.classList.remove('dragging');
                canvasWrapper.classList.remove('drag-hover');
            }

            function updateScore() { scoreDisplay.textContent = score; }

            function updateTimeDisplay() {
                if (!gameActive) return;
                let effectiveMs = Date.now() - startTime - totalPausedMs;
                if (gamePaused && pauseStartTime > 0) effectiveMs -= (Date.now() - pauseStartTime);
                const secs = Math.max(0, Math.floor(effectiveMs / 1000));
                const m = Math.floor(secs / 60),
                    s = secs % 60;
                timeDisplay.textContent = `${m}:${s.toString().padStart(2,'0')}`;
            }

            function increaseDiff() { difficultyLevel++; }

            function startTimer() {
                startTime = Date.now();
                totalPausedMs = 0;
                pauseStartTime = 0;
                elapsedSeconds = 0;
                updateTimeDisplay();
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!gameActive) return;
                    if (!gamePaused) {
                        const effectiveMs = Date.now() - startTime - totalPausedMs;
                        const newSecs = Math.floor(effectiveMs / 1000);
                        if (newSecs !== elapsedSeconds) {
                            elapsedSeconds = newSecs;
                            updateTimeDisplay();
                            if (elapsedSeconds > 0 && elapsedSeconds % 60 === 0 && difficultyLevel < Math.floor(
                                    elapsedSeconds / 60)) increaseDiff();
                        }
                    }
                    updateTimeDisplay();
                }, 300);
            }

            /* ═══════════════════════════════════════════════
               PAUSE SYSTEM
               ═══════════════════════════════════════════════ */
            function pauseGame() {
                if (!gameActive || gamePaused) return;
                gamePaused = true;
                pauseStartTime = Date.now();
                pauseAllMusic();
                sfxPause();
                pauseOverlay.classList.add('active');
                drawBoard();
            }

            function resumeGame() {
                if (!gameActive || !gamePaused) return;
                totalPausedMs += Date.now() - pauseStartTime;
                pauseStartTime = 0;
                gamePaused = false;
                pauseOverlay.classList.remove('active');
                sfxResume();
                startGameplayMusic();
                updateTimeDisplay();
                drawBoard();
                renderTray();
            }

            function goHomeFromPause() {
                totalPausedMs += Date.now() - pauseStartTime;
                pauseStartTime = 0;
                gamePaused = false;
                pauseOverlay.classList.remove('active');
                goHome();
            }

            /* ═══════════════════════════════════════════════
               RENDERING
               ═══════════════════════════════════════════════ */
            function drawBoard() {
                const CS = getCellSize();
                const GP = getGridPx();
                ctx.clearRect(0, 0, GP, GP);
                ctx.fillStyle = '#080c14';
                ctx.fillRect(0, 0, GP, GP);
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CS, 0);
                    ctx.lineTo(i * CS, GP);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CS);
                    ctx.lineTo(GP, i * CS);
                    ctx.stroke();
                }
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (grid[r][c] !== null && !clearingCells.some(cl => cl.row === r && cl.col === c)) {
                            draw3DBlock(ctx, c * CS, r * CS, CS, COLORS[grid[r][c]]);
                        }
                    }
                }
                for (const p of popAnims) {
                    const x = p.col * CS,
                        y = p.row * CS;
                    const s = 1 + (1 - p.life) * 0.25;
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.roundRect(x + CS / 2 - (CS - 6) / 2 * s, y + CS / 2 - (CS - 6) / 2 * s, (CS - 6) * s, (CS - 6) * s,
                        9);
                    ctx.stroke();
                    ctx.restore();
                }
                if (clearingCells.length) {
                    const a = Math.max(0, clearAnimTimer / 300);
                    ctx.fillStyle = `rgba(255,255,255,${a*0.8})`;
                    clearingCells.forEach(({ row, col }) => ctx.fillRect(col * CS + 1, row * CS + 1, CS - 2, CS - 2));
                }
                if (dragState && dragState.valid && dragState.sr >= 0 && dragState.sc >= 0 && !gamePaused) {
                    const piece = pieces[dragState.idx];
                    if (piece) {
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        for (const [r, c] of piece.shape) {
                            const nr = dragState.sr + r,
                                nc = dragState.sc + c;
                            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                                ctx.beginPath();
                                ctx.roundRect(nc * CS + 5, nr * CS + 5, CS - 8, CS - 8, 7);
                                ctx.fill();
                            }
                        }
                        ctx.fillStyle = 'rgba(255,255,255,0.22)';
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        ctx.lineWidth = 2;
                        for (const [r, c] of piece.shape) {
                            const nr = dragState.sr + r,
                                nc = dragState.sc + c;
                            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                                ctx.fillRect(nc * CS + 3, nr * CS + 3, CS - 6, CS - 6);
                                ctx.strokeRect(nc * CS + 3, nr * CS + 3, CS - 6, CS - 6);
                            }
                        }
                    }
                }
                if (gamePaused) {
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fillRect(0, 0, GP, GP);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 28px "Quicksand", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('⏸ JEDA', GP / 2, GP / 2);
                }
                drawParticles(ctx);
            }

            function renderTray() {
                pieceTray.innerHTML = '';
                const CS = getCellSize();
                const miniScale = Math.min(1, CS / 55);
                const sz = Math.round(80 * miniScale);
                pieces.forEach((piece, i) => {
                    const card = document.createElement('div');
                    card.className = `piece-card${i===selectedPieceIndex?' selected':''}`;
                    card.dataset.index = i;
                    const mc = document.createElement('canvas');
                    mc.className = 'piece-canvas';
                    mc.width = sz;
                    mc.height = sz;
                    const mctx = mc.getContext('2d');
                    const b = getBounds(piece.shape);
                    const cd = Math.min(Math.round(30 * miniScale), Math.floor((sz - 10) / Math.max(b.rows, b
                    .cols)));
                    const ox = (sz - b.cols * cd) / 2,
                        oy = (sz - b.rows * cd) / 2;
                    const color = COLORS[piece.colorIdx];
                    piece.shape.forEach(([r, c]) => {
                        const px = ox + (c - b.minC) * cd,
                            py = oy + (r - b.minR) * cd;
                        draw3DBlockSimple(mctx, px, py, cd, color);
                    });
                    card.appendChild(mc);
                    card.addEventListener('pointerdown', e => {
                        if (!gameActive || gamePaused) return;
                        initAudio();
                        ensureAudioRunning();
                        e.preventDefault();
                        e.stopPropagation();
                        startDrag(e, i);
                    });
                    card.addEventListener('click', e => {
                        if (!gameActive || gamePaused || dragState) return;
                        initAudio();
                        ensureAudioRunning();
                        if (selectedPieceIndex === i) selectedPieceIndex = -1;
                        else { selectedPieceIndex = i;
                            sfxSelect(); }
                        renderTray();
                        drawBoard();
                    });
                    pieceTray.appendChild(card);
                });
            }

            /* ═══════════════════════════════════════════════
               DRAG SYSTEM
               ═══════════════════════════════════════════════ */
            function startDrag(e, idx) {
                if (!gameActive || gamePaused || idx >= pieces.length) return;
                initAudio();
                ensureAudioRunning();
                const piece = pieces[idx];
                const b = getBounds(piece.shape);
                const CS = getCellSize();
                const ghW = b.cols * CS;
                const ghH = b.rows * CS;
                ghostCanvas.width = ghW + 8;
                ghostCanvas.height = ghH + 8;
                ghostCtx.clearRect(0, 0, ghW + 8, ghH + 8);
                ghostCtx.fillStyle = 'rgba(0,0,0,0.4)';
                piece.shape.forEach(([r, c]) => {
                    const px = (c - b.minC) * CS + 5,
                        py = (r - b.minR) * CS + 5;
                    ghostCtx.beginPath();
                    ghostCtx.roundRect(px, py, CS - 4, CS - 4, 9);
                    ghostCtx.fill();
                });
                const color = COLORS[piece.colorIdx];
                piece.shape.forEach(([r, c]) => {
                    const px = (c - b.minC) * CS + 2,
                        py = (r - b.minR) * CS + 2;
                    draw3DBlock(ghostCtx, px, py, CS, color, 0.95);
                });
                dragGhost.style.width = (ghW + 8) + 'px';
                dragGhost.style.height = (ghH + 8) + 'px';
                dragGhost.classList.add('active');
                const rect = boardCanvas.getBoundingClientRect();
                const sx = boardCanvas.width / rect.width;
                const sy = boardCanvas.height / rect.height;
                const cx = (e.clientX - rect.left) * sx;
                const cy = (e.clientY - rect.top) * sy;
                const sc = Math.round(cx / CS - b.minC - (b.cols - 1) / 2);
                const sr = Math.round(cy / CS - b.minR - (b.rows - 1) / 2);
                dragState = { idx, pointerId: e.pointerId, b, sr, sc, valid: canPlace(piece.shape, sr, sc) };
                updateGhostScreenPos(sr, sc, b);
                document.body.classList.add('dragging');
                selectedPieceIndex = -1;
                renderTray();
                pieceTray.querySelectorAll('.piece-card').forEach((c, j) => { if (j === idx) c.classList.add(
                        'dragging-source'); });
                document.addEventListener('pointermove', onDragMove, { passive: false });
                document.addEventListener('pointerup', onDragEnd);
                document.addEventListener('pointercancel', onDragEnd);
            }

            function updateGhostScreenPos(sr, sc, b) {
                const CS = getCellSize();
                const rect = boardCanvas.getBoundingClientRect();
                const sx = boardCanvas.width / rect.width;
                const sy = boardCanvas.height / rect.height;
                const bx = (sc + b.minC) * CS - 2;
                const by = (sr + b.minR) * CS - 2;
                const screenX = rect.left + bx / sx;
                const screenY = rect.top + by / sy;
                dragGhost.style.left = screenX + 'px';
                dragGhost.style.top = screenY + 'px';
            }

            function onDragMove(e) {
                if (!dragState || e.pointerId !== dragState.pointerId) return;
                if (gamePaused) { onDragEnd(e); return; }
                e.preventDefault();
                const CS = getCellSize();
                const rect = boardCanvas.getBoundingClientRect();
                const sx = boardCanvas.width / rect.width;
                const sy = boardCanvas.height / rect.height;
                const cx = (e.clientX - rect.left) * sx;
                const cy = (e.clientY - rect.top) * sy;
                const b = dragState.b;
                const sc = Math.round(cx / CS - b.minC - (b.cols - 1) / 2);
                const sr = Math.round(cy / CS - b.minR - (b.rows - 1) / 2);
                const valid = (sr >= 0 && sr < GRID_SIZE && sc >= 0 && sc < GRID_SIZE && pieces[dragState.idx] && canPlace(
                    pieces[dragState.idx].shape, sr, sc));
                dragState.sr = sr;
                dragState.sc = sc;
                dragState.valid = valid;
                updateGhostScreenPos(sr, sc, b);
                canvasWrapper.classList.toggle('drag-hover', valid);
                drawBoard();
            }

            function onDragEnd(e) {
                if (!dragState || e.pointerId !== dragState.pointerId) return;
                document.removeEventListener('pointermove', onDragMove);
                document.removeEventListener('pointerup', onDragEnd);
                document.removeEventListener('pointercancel', onDragEnd);
                const { idx, sr, sc, valid } = dragState;
                dragState = null;
                dragGhost.classList.remove('active');
                document.body.classList.remove('dragging');
                canvasWrapper.classList.remove('drag-hover');
                pieceTray.querySelectorAll('.piece-card').forEach(c => c.classList.remove('dragging-source'));
                if (valid && gameActive && !gamePaused && idx < pieces.length) {
                    if (!placePiece(idx, sr, sc)) sfxInvalid();
                } else if (gameActive && !gamePaused) { sfxInvalid(); }
                drawBoard();
                renderTray();
            }

            /* ═══════════════════════════════════════════════
               TAP-TO-PLACE
               ═══════════════════════════════════════════════ */
            boardCanvas.addEventListener('click', e => {
                if (!gameActive || gamePaused || dragState) return;
                if (selectedPieceIndex < 0 || selectedPieceIndex >= pieces.length) return;
                initAudio();
                ensureAudioRunning();
                const CS = getCellSize();
                const rect = boardCanvas.getBoundingClientRect();
                const sx = boardCanvas.width / rect.width;
                const sy = boardCanvas.height / rect.height;
                const cx = (e.clientX - rect.left) * sx;
                const cy = (e.clientY - rect.top) * sy;
                const b = getBounds(pieces[selectedPieceIndex].shape);
                const sc = Math.round(cx / CS - b.minC - (b.cols - 1) / 2);
                const sr = Math.round(cy / CS - b.minR - (b.rows - 1) / 2);
                if (sr >= 0 && sr < GRID_SIZE && sc >= 0 && sc < GRID_SIZE) {
                    if (!placePiece(selectedPieceIndex, sr, sc)) sfxInvalid();
                } else sfxInvalid();
            });

            /* ═══════════════════════════════════════════════
               NAVIGATION
               ═══════════════════════════════════════════════ */
            function showStart() {
                gameActive = false;
                gamePaused = false;
                pauseOverlay.classList.remove('active');
                stopGameplayMusic();
                if (timerInterval) clearInterval(timerInterval);
                gameOverOverlay.classList.remove('active');
                startPage.classList.add('active');
                gamePage.classList.remove('active');
                dragState = null;
                dragGhost.classList.remove('active');
                document.body.classList.remove('dragging');
                canvasWrapper.classList.remove('drag-hover');
                clearingCells = [];
                particles = [];
                popAnims = [];
                resetGrid();
                pieces = [];
                selectedPieceIndex = -1;
                pieceTray.innerHTML = '';
                updateCanvasSize();
                drawBoard();
                startStartPageMusic();
            }

            function startGame() {
                initAudio();
                ensureAudioRunning();
                sfxStartButton();
                stopStartPageMusic();
                loadingOverlay.classList.add('active');
                sfxLoading();
                setTimeout(() => {
                    loadingOverlay.classList.remove('active');
                    resetGrid();
                    score = 0;
                    difficultyLevel = 0;
                    elapsedSeconds = 0;
                    totalPausedMs = 0;
                    pauseStartTime = 0;
                    clearingCells = [];
                    clearAnimTimer = 0;
                    particles = [];
                    popAnims = [];
                    dragState = null;
                    gamePaused = false;
                    pauseOverlay.classList.remove('active');
                    dragGhost.classList.remove('active');
                    document.body.classList.remove('dragging');
                    canvasWrapper.classList.remove('drag-hover');
                    updateScore();
                    updateTimeDisplay();
                    gameActive = true;
                    selectedPieceIndex = -1;
                    pieces = [];
                    updateCanvasSize();
                    genPieces(3);
                    drawBoard();
                    renderTray();
                    startPage.classList.remove('active');
                    gamePage.classList.add('active');
                    gameOverOverlay.classList.remove('active');
                    startTimer();
                    startGameplayMusic();
                }, 600);
            }

            function retryGame() {
                initAudio();
                ensureAudioRunning();
                sfxStartButton();
                stopGameplayMusic();
                gamePaused = false;
                pauseOverlay.classList.remove('active');
                loadingOverlay.classList.add('active');
                sfxLoading();
                setTimeout(() => {
                    loadingOverlay.classList.remove('active');
                    resetGrid();
                    score = 0;
                    difficultyLevel = 0;
                    elapsedSeconds = 0;
                    totalPausedMs = 0;
                    pauseStartTime = 0;
                    clearingCells = [];
                    clearAnimTimer = 0;
                    particles = [];
                    popAnims = [];
                    dragState = null;
                    dragGhost.classList.remove('active');
                    document.body.classList.remove('dragging');
                    canvasWrapper.classList.remove('drag-hover');
                    updateScore();
                    updateTimeDisplay();
                    gameActive = true;
                    selectedPieceIndex = -1;
                    pieces = [];
                    updateCanvasSize();
                    genPieces(3);
                    drawBoard();
                    renderTray();
                    gameOverOverlay.classList.remove('active');
                    startTimer();
                    startGameplayMusic();
                }, 500);
            }

            function goHome() {
                gameActive = false;
                gamePaused = false;
                pauseOverlay.classList.remove('active');
                stopGameplayMusic();
                if (timerInterval) clearInterval(timerInterval);
                gameOverOverlay.classList.remove('active');
                startPage.classList.add('active');
                gamePage.classList.remove('active');
                dragState = null;
                dragGhost.classList.remove('active');
                document.body.classList.remove('dragging');
                canvasWrapper.classList.remove('drag-hover');
                clearingCells = [];
                particles = [];
                popAnims = [];
                resetGrid();
                pieces = [];
                selectedPieceIndex = -1;
                pieceTray.innerHTML = '';
                updateCanvasSize();
                drawBoard();
                startStartPageMusic();
            }

            /* ═══════════════════════════════════════════════
               EVENT LISTENERS
               ═══════════════════════════════════════════════ */
            document.getElementById('btnStart').addEventListener('click', (e) => {
                e.preventDefault();
                startGame();
            });
            document.getElementById('btnRetry').addEventListener('click', (e) => {
                e.preventDefault();
                retryGame();
            });
            document.getElementById('btnHome').addEventListener('click', (e) => {
                e.preventDefault();
                goHome();
            });
            document.getElementById('btnPause').addEventListener('click', (e) => {
                e.preventDefault();
                if (!gameActive) return;
                initAudio();
                ensureAudioRunning();
                if (gamePaused) resumeGame();
                else pauseGame();
            });
            document.getElementById('btnContinue').addEventListener('click', (e) => {
                e.preventDefault();
                resumeGame();
            });
            document.getElementById('btnPauseHome').addEventListener('click', (e) => {
                e.preventDefault();
                goHomeFromPause();
            });

            /* ═══════════════════════════════════════════════
               GAME LOOP
               ═══════════════════════════════════════════════ */
            let lastT = performance.now();

            function loop(ts) {
                const dt = Math.min((ts - lastT) / 16.67, 3);
                lastT = ts;
                if (gameActive && !gamePaused) {
                    if (clearAnimTimer > 0) { clearAnimTimer -= 16.67; if (clearAnimTimer < 0) clearAnimTimer = 0; }
                    for (let i = popAnims.length - 1; i >= 0; i--) { popAnims[i].life -= 0.04 * dt; if (popAnims[i].life <=
                            0) popAnims.splice(i, 1); }
                    updateParticles(dt);
                    drawBoard();
                }
                if (gameActive && gamePaused) {
                    drawBoard();
                }
                requestAnimationFrame(loop);
            }

            /* ═══════════════════════════════════════════════
               INITIALIZATION
               ═══════════════════════════════════════════════ */
            resetGrid();
            updateCanvasSize();
            drawBoard();
            requestAnimationFrame(loop);

            // Start music on first user interaction
            document.addEventListener('click', function firstInteraction() {
                initAudio();
                ensureAudioRunning();
                startStartPageMusic();
                document.removeEventListener('click', firstInteraction);
            }, { once: true });

            document.addEventListener('touchstart', function firstTouch() {
                initAudio();
                ensureAudioRunning();
                startStartPageMusic();
                document.removeEventListener('touchstart', firstTouch);
            }, { once: true });

            window.addEventListener('resize', () => {
                updateCanvasSize();
                renderTray();
                if (dragState) {
                    dragGhost.classList.remove('active');
                    dragState = null;
                    document.body.classList.remove('dragging');
                    canvasWrapper.classList.remove('drag-hover');
                    pieceTray.querySelectorAll('.piece-card').forEach(c => c.classList.remove('dragging-source'));
                }
            });

            window.addEventListener('blur', () => {
                if (dragState) {
                    dragState = null;
                    dragGhost.classList.remove('active');
                    document.body.classList.remove('dragging');
                    canvasWrapper.classList.remove('drag-hover');
                    pieceTray.querySelectorAll('.piece-card').forEach(c => c.classList.remove('dragging-source'));
                    drawBoard();
                    renderTray();
                    document.removeEventListener('pointermove', onDragMove);
                    document.removeEventListener('pointerup', onDragEnd);
                    document.removeEventListener('pointercancel', onDragEnd);
                }
            });

            console.log('🎮 BLOX RUN • Developer: Nnfachy');
            console.log('🎵 Musik: 100% synthesized – bebas hak cipta');
            console.log('🖱️ Seret blok ke grid • Klik pilih + klik grid');
            console.log('⏸️ Tombol jeda di kiri atas');
            console.log('⏱️ Kesulitan naik tiap 60 detik');
            console.log('🔊 Semua audio dibuat dengan Web Audio API (tidak ada file suara eksternal)');
        })();
    </script>
</body>
</html>
